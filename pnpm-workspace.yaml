# 允许带 install 脚本的依赖执行构建（pnpm 默认拦截）
allowBuilds:
  # sass 文件监听（开发热更新）
  '@parcel/watcher': true
  # vite-plus / vitepress / vitest 间接依赖的原生二进制
  esbuild: true

# 默认 1440 分钟内新发布的包不能装。vite-plus 1.0.0 当天发布，关掉等待
# minimumReleaseAge: 0

# vite 别名统一走 catalog：项目仅用 vite-plus（vite.config.ts 从 vite-plus 引入 defineConfig），不直接依赖 vite；
# override 只作用于插件/vitest 的 vite peer，把它们统一别名到 vite-plus-core，避免 autoInstallPeers 拉入真实 vite@8 造成双实例
# （注：不要在 package.json 里再写 vite: catalog: 直接依赖，否则与本 override 在全新解析时冲突、被误解析成 vite@<version>）
# Codemirror 已不再经 vue-codemirror6 的 peer 引入，无需版本 override
overrides:
  vite@*: 'catalog:'

# Java 序列化：补丁支持 TC_CLASS / Externalizable（如 java.time）
patchedDependencies:
  java-object-serialization@0.1.2: patches/java-object-serialization@0.1.2.patch
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
