# core24：二进制需要 GLIBC_2.39；gnome 扩展从 core24 起才接 gpu-2404，并清掉包内旧 Mesa。
# WebKit 用 gnome-46-2404 里的，不要 stage，也不要写 layout。
# deb 从已公开的 GitHub Release 下载，不使用本机文件。
# Release 必须已发布（草稿没有公开地址）。本地在仓库根目录 snapcraft pack（LXD，不要 --destructive-mode）。
name: redis-me
title: RedisME
base: core24
version: '6.0.0' # 与 package.json 保持一致
summary: Redis / Valkey desktop client
description: |
  RedisME is a desktop GUI for Redis and Valkey.
  Connect, browse keys, edit values, and manage multiple connections.
license: GPL-3.0
website: https://www.hepengju.com
source-code: https://github.com/hepengju/redis-me
contact: he_pengju@163.com
icon: snap/gui/redis-me.png

grade: stable
confinement: strict

# 平台名就是架构时，build-on / build-for 默认与平台名相同。
# amd64 机器只打 amd64；arm64 要在 arm64 机器上打。
platforms:
  amd64:
  arm64:

# 总线名是 identifier + ".SingleInstance"
slots:
  single-instance:
    interface: dbus
    bus: session
    name: com.hepengju.redis.SingleInstance

plugs:
  single-instance-plug:
    interface: dbus
    bus: session
    name: com.hepengju.redis.SingleInstance

apps:
  redis-me:
    extensions: [gnome]
    command: usr/bin/RedisME
    desktop: usr/share/applications/redis-me.desktop
    # wayland / x11 / desktop / opengl 由 gnome 扩展补上
    plugs:
      - home
      - network
      - unity7
      - removable-media # 导入导出额外挂载点
      - single-instance-plug
    slots:
      - single-instance

parts:
  redis-me:
    plugin: nil
    source: snap
    build-packages: [dpkg, curl, ca-certificates]
    override-build: |
      # Snapcraft 9 脚本里没有版本变量，从本文件的 version 取
      arch="${CRAFT_ARCH_BUILD_FOR:?CRAFT_ARCH_BUILD_FOR 为空}"
      ver=$(awk '/^version:/{gsub(/['\''"]/,"",$2); print $2; exit}' "$CRAFT_PROJECT_DIR/snap/snapcraft.yaml")
      if [ -z "$ver" ]; then
        echo "snapcraft.yaml 里没有 version" >&2
        exit 1
      fi
      url="https://github.com/hepengju/redis-me/releases/download/v${ver}/RedisME_${ver}_${arch}.deb"
      deb="$CRAFT_PART_BUILD/RedisME_${ver}_${arch}.deb"
      echo "下载 ${url}"
      curl -fL --retry 3 --retry-delay 2 -o "$deb" "$url"
      dpkg -x "$deb" "$CRAFT_PART_INSTALL/"
      cp "$CRAFT_PART_INSTALL"/usr/share/applications/*.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/redis-me.desktop"
      sed -i \
        -e 's|^Exec=.*|Exec=redis-me %U|' \
        -e 's|^Icon=.*|Icon=/usr/share/icons/hicolor/128x128/apps/RedisME.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/redis-me.desktop"
