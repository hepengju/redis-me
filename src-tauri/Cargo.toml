[package]
name = "redis-me"
version = "1.0.0"
description = "Redis Desktop Manager based on Tauri"
authors = ["hepengju"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "redis_me_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri默认依赖
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-log = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 项目添加依赖。redis-me-rs 是 redis-rs 1.8.1 的 fork，crate 名仍是 redis。
redis = { package = "redis-me-rs", version = "1.8.1", features = [
  "acl",
  "cluster",
  "sentinel",
  "json",
  "vector-sets",
  "tls-rustls",
  "tls-rustls-insecure",
] }
url = "2"
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
parking_lot = "0.13"
log = "0.4"
rand = "0.10"
anyhow = { version = "1" }
base64 = "0.23"
chrono = "0.4"
fern = { version = "0.7", features = ["colored"] }

# 目录支持~和环境变量
shellexpand = "3"

# TLS：检测 X.509 v1 PEM（跳过 v1 CA 装入 rustls trust store）
x509-parser = "0.18"

# SSH 隧道支持（使用 russh 支持现代密钥格式）
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-system-fonts = "2"
tauri-plugin-clipboard-manager = "2"

# 支持TS类型
specta = { version = "2.0.0-rc.28", features = ["derive", "chrono", "serde_json"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "2.0.0-rc.29", features = ["typescript"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[[bin]]
name = "RedisME"
path = "src/main.rs"

# 安装包体积：体积优先的 release。不改变运行时功能。
# opt-level=s 偏体积；LTO + codegen-units=1 去掉跨 crate 死代码；strip 去掉符号。
# panic=abort 去掉展开表。命令路径不用 catch_unwind，panic 本来就会中断这次调用。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
